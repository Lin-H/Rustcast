name: Build Tauri release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: rustcast-windows
          - os: ubuntu-latest
            platform: linux
            artifact_name: rustcast-linux
          - os: macos-latest
            platform: macos
            artifact_name: rustcast-macos

    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build app
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      - name: Rename and collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          case "${{ matrix.platform }}" in
            windows)
              # NSIS exe（含 updater 产物）+ 签名
              find src-tauri/target/release/bundle -type f \( \
                -iname "*.exe" -o -iname "*.exe.sig" \
              \) -exec bash -c '
                  for file do
                    cp "$file" "release-assets/${TAG_NAME}-${{ matrix.platform }}-$(basename "$file")"
                  done
                ' bash {} +
              ;;
            linux)
              find src-tauri/target/release/bundle -type f \( \
                -iname "*.AppImage" -o -iname "*.AppImage.sig" -o -iname "*.deb" \
              \) -exec bash -c '
                  for file do
                    cp "$file" "release-assets/${TAG_NAME}-${{ matrix.platform }}-$(basename "$file")"
                  done
                ' bash {} +
              ;;
            macos)
              find src-tauri/target/release/bundle -type f \( \
                -iname "*.dmg" -o -iname "*.app.tar.gz" -o -iname "*.app.tar.gz.sig" \
              \) -exec bash -c '
                  for file do
                    cp "$file" "release-assets/${TAG_NAME}-${{ matrix.platform }}-$(basename "$file")"
                  done
                ' bash {} +
              ;;
          esac
          ls -la release-assets

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_URL: https://github.com/Lin-H/Rustcast/releases/download/${{ github.ref_name }}
        run: |
          set -eu
          # 从 Cargo.toml 读版本号（与 tag 一致，不带 v 前缀）
          VERSION="${TAG_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          sig_of() {
            local f
            f=$(find release-assets -name "*${1}*.sig" | head -n 1)
            if [ -z "$f" ]; then
              echo "MISSING SIGNATURE for $1" >&2
              exit 1
            fi
            cat "$f" | tr -d '\n\r'
          }

          dl_url() {
            local f
            f=$(find release-assets -name "*${1}*" ! -name "*.sig" | head -n 1)
            basename "$f"
          }

          WIN_EXE=$(dl_url "windows-*setup.exe")
          WIN_SIG=$(sig_of "windows-*setup.exe")
          LIN_APP=$(dl_url "linux-*.AppImage")
          LIN_SIG=$(sig_of "linux-*.AppImage")
          MAC_TGZ=$(dl_url "macos-*.app.tar.gz")
          MAC_SIG=$(sig_of "macos-*.app.tar.gz")

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Rustcast ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${REPO_URL}/${WIN_EXE}"
              },
              "linux-x86_64": {
                "signature": "${LIN_SIG}",
                "url": "${REPO_URL}/${LIN_APP}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${REPO_URL}/${MAC_TGZ}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          make_latest: true
