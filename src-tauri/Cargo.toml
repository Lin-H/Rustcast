[package]
name = "rustcast"
version = "0.2.0"
description = "Rustcast RSS audio player"
authors = ["Lin-H"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
feed-rs = "2.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
